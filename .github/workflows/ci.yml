name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sopon
          POSTGRES_PASSWORD: sopon_secret
          POSTGRES_DB: sopon_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm approve-builds --all || true

      - name: Generate Database Client
        run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://sopon:sopon_secret@localhost:5432/sopon_test_db

      - name: Run Typechecks
        run: pnpm typecheck

      - name: Run Unit Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://sopon:sopon_secret@localhost:5432/sopon_test_db
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-key-32-chars-long-dummy

      - name: Build All Workspaces
        run: pnpm build
        env:
          DATABASE_URL: postgresql://sopon:sopon_secret@localhost:5432/sopon_test_db
          REDIS_URL: redis://localhost:6379
          AUTH_SECRET: test-secret-key-32-chars-long-dummy